name: Build site tĩnh từ data/

# CHỈ chạy khi data/posts.json đổi — file này LUÔN là commit CHỐT của mọi thao tác Lưu/Xoá
# trong trang quản trị (ảnh -> nội dung -> danh sách, danh sách ghi SAU CÙNG).
#
# ⚠️ ĐỪNG đổi thành `data/**`: một thao tác Lưu tạo NHIỀU commit liên tiếp, trigger theo cả
# thư mục sẽ chạy ngay từ commit đầu tiên — lúc đó danh sách chưa cập nhật, build ra site ở
# trạng thái DỞ DANG rồi deploy đè (bug thật đã gặp, xem static-site-build.md mục 5).
on:
  push:
    branches: [master]
    paths:
      - 'data/posts.json'
      - 'templates/**'
      - 'scripts/build.py'
      - 'scripts/build-seo.py'
  workflow_dispatch: {}

# Hai lần Lưu sát nhau thì chỉ cần bản cuối; huỷ luôn lần build đang chạy dở.
concurrency:
  group: build-site
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build trang từ data/
        run: python3 scripts/build.py

      - name: Sinh <head>, robots.txt và sitemap.xml
        run: python3 scripts/build-seo.py

      - name: Kiểm tra trước khi commit
        run: |
          set -e
          # 1. Mọi trang phải có đúng 1 khối dữ liệu có cấu trúc và khối đó phải parse được.
          python3 - <<'PY'
          import json, re, glob, sys
          bad = []
          for f in glob.glob('html/**/*.html', recursive=True):
              if f.endswith('html/admin/index.html'):
                  continue
              s = open(f, encoding='utf-8').read()
              blocks = re.findall(r'<script type="application/ld\+json">(.*?)</script>', s, re.S)
              if len(blocks) != 1:
                  bad.append(f + ': có %d khối ld+json' % len(blocks)); continue
              try:
                  json.loads(blocks[0].replace('<\\/', '</'))
              except Exception as e:
                  bad.append(f + ': JSON hỏng - %s' % e)
              if 'rel="canonical"' not in s:
                  bad.append(f + ': thiếu canonical')
          if bad:
              print('\n'.join(bad)); sys.exit(1)
          print('OK: mọi trang có canonical + dữ liệu có cấu trúc hợp lệ')
          PY

          # 2. Ô bẫy bot phải còn được ẩn (hỏng cái này là form hỏng IM LẶNG).
          grep -q 'hp-field' html/css/style.css || {
            echo 'LỖI: mất rule CSS ẩn ô bẫy bot trong style.css'; exit 1; }

          # 3. Build 2 lần phải ra kết quả y hệt (idempotent).
          # ⚠️ PHẢI `git add` kết quả build LẦN 1 trước khi build lần 2, để git index giữ
          # đúng ảnh chụp lần 1 mà so sánh. Thiếu bước add này, `git diff` bên dưới lại so
          # lần build 2 với html/ ĐÃ COMMIT TỪ TRƯỚC (tức là html/ ở trạng thái CŨ, chưa có
          # thay đổi data/ lần này) — nên hễ có nội dung mới thật sự (vd: thêm bài viết) là
          # diff luôn khác 0 và bị báo nhầm "non-idempotent" dù build hoàn toàn đúng. Bug thật
          # đã gặp: bài CMS đầu tiên qua pipeline này bị chặn deploy vì lỗi này.
          git add -A -- html/
          python3 scripts/build.py >/dev/null && python3 scripts/build-seo.py >/dev/null
          git diff --quiet -- html/ || {
            echo 'LỖI: build lần 2 ra kết quả khác lần 1'; git diff --stat -- html/; exit 1; }

      - name: Commit kết quả build
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # CI chỉ đụng html/ — KHÔNG đụng data/, nên commit này không tự trigger lại chính nó.
          git add html/
          if git diff --cached --quiet; then
            echo "Không có gì thay đổi, bỏ qua commit."
          else
            git commit -m "CI: build html from data"
            git push
          fi
